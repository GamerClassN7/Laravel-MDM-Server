version: "3"
services:
  php:
    build:
      context: .
      target: php
      args:
        - APP_ENV=${APP_ENV}
    environment:
      - APP_ENV=${APP_ENV}
      - CONTAINER_ROLE=app
    working_dir: /vaw/www/
    volumes:
      - ./:/vaw/www/
    ports:
      - 8000:8000
    depends_on:
      - database

  reverb:
    build:
      context: .
      target: php
    environment:
      - APP_ENV=${APP_ENV}
      - CONTAINER_ROLE=reverb
    working_dir: /vaw/www/
    volumes:
      - ./:/vaw/www/
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    restart: unless-stopped
    ports:
      - 8080:8080
    depends_on:
      - php

  database:
    image: mysql:8.0
    ports:
      - ${DB_PORT}:3306
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: ~
