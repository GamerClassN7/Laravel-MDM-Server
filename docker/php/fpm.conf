[global]
error_log = /proc/self/fd/2
; long log lines (exceptions with context) are not split
log_limit = 16384

[www]
listen = 127.0.0.1:9000
; small on-demand pool, idle workers are stopped to save memory
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
